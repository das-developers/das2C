# Build libdas3 and run the base test set on every push and pull request.
# SPICE and CDF are not installed here, so the test_spice and test_cdf sets
# stay off; the makefile keys them on SPICE=yes / CDF=yes.

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get -y install libexpat-dev libfftw3-dev libssl-dev zlib1g-dev

      - name: Build
        run: make N_ARCH=/ PREFIX=$GITHUB_WORKSPACE

      # TestCatalog in test_main queries das2.org live, so a failure here can
      # be that host and not the code.
      - name: Test
        run: make N_ARCH=/ PREFIX=$GITHUB_WORKSPACE test
