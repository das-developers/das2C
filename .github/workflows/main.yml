# Build libdas3 and the programs, then run the tests, on every push and pull
# request.  This is the default build, so SPICE and CDF are in: the makefile
# downloads CSPICE and builds CDF from source each run.  They aren't cached,
# the CSPICE rule depends on its 114 MB tarball, so a useful cache would be
# twice that, while fetching costs about a minute.

name: Ubuntu

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get -y install libexpat-dev libfftw3-dev libssl-dev zlib1g-dev

      - name: Build
        run: make N_ARCH=/ PREFIX=$GITHUB_WORKSPACE

      # TestCatalog in test_main queries das2.org live, so a failure here can
      # be that host and not the code.
      - name: Test
        run: make N_ARCH=/ PREFIX=$GITHUB_WORKSPACE test
