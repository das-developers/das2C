# Map Juno/Waves survey spectra onto chosen CDF variable names, for use
# with examples/ex09_juno_waves_survey.d2t:
#
#  das3_cdf -r -i examples/ex09_juno_waves_survey.d2t \
#     -m examples/ex09_waves_survey_varmap.conf -o ex09_mapped.cdf
#
# Each line is OUTPUT_NAME = PACKET_ID DIMENSION, where DIMENSION is the
# name of the upconverted das3 dimension.  The example's <x> plane has no
# name, so its time dimension is "time".  The four packet IDs are the
# receiver bands; all four stay in das3 group spec_dens, which das3_cdf
# writes as plotGroup on each band's data variable.

LFR_LO       = 10 spec_dens
LFR_LO_Epoch = 10 time
LFR_LO_Freq  = 10 frequency

LFR_HI       = 20 spec_dens
LFR_HI_Epoch = 20 time
LFR_HI_Freq  = 20 frequency

HFR_LO       = 30 spec_dens
HFR_LO_Epoch = 30 time
HFR_LO_Freq  = 30 frequency

HFR_HI       = 40 spec_dens
HFR_HI_Epoch = 40 time
HFR_HI_Freq  = 40 frequency

